name: LEGIONHBT CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install agent dependencies
      run: |
        pip install -r legionhbt-agent/requirements.txt

    - name: Install model dependencies
      run: |
        pip install -r legionhbt-model/requirements.txt

    - name: Install RAG dependencies
      run: |
        pip install -r legionhbt-rag/requirements.txt

    - name: Run tests
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v --cov=legionhbt --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install flake8 black isort

    - name: Run flake8
      run: |
        flake8 legionhbt --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check black formatting
      run: |
        black --check legionhbt || true

    - name: Check import sorting
      run: |
        isort --check-only legionhbt || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r legionhbt -f json -o bandit-report.json || true
        bandit -r legionhbt || true

    - name: Check dependencies for vulnerabilities
      run: |
        safety check || true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build twine

    - name: Build packages
      run: |
        python -m build
        cd legionhbt-agent && python -m build && cd ..
        cd legionhbt-model && python -m build && cd ..
        cd legionhbt-rag && python -m build && cd ..

    - name: Check package integrity
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: |
          dist/
          legionhbt-agent/dist/
          legionhbt-model/dist/
          legionhbt-rag/dist/

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t legionhbt:latest . || echo "No Dockerfile found, skipping"

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        pip install build twine

    - name: Build packages
      run: |
        python -m build
        cd legionhbt-agent && python -m build && cd ..
        cd legionhbt-model && python -m build && cd ..
        cd legionhbt-rag && python -m build && cd ..

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing || echo "PyPI upload skipped"
